<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Independence Day Greeting Generator</title>
  <meta name="description" content="Generate your personalized 80th Independence Day digital greeting poster with your photo and name.">
  <meta name="theme-color" content="#060a17">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇳</text></svg>">
</head>
<body>

  <!-- Top Tricolor Accent Line -->
  <div class="bg-tricolor-line"></div>

  <!-- Background Ambient Glow Layer -->
  <div class="bg-ambient-layer">
    <div class="bg-ambient-beam"></div>
  </div>


  <!-- Main Content Form Area -->
  <main class="main-content">
    <div class="creator-card">
      
      <!-- Card Title & Subtitle -->
      <div class="card-header">
        <h2 class="card-title">Create Your <span class="highlight-gold">Independence Day</span> Greeting</h2>
        <p class="card-subtitle">Personalize your Independence Day celebration poster with your photo and name.</p>
      </div>

      <!-- Generator Form -->
      <form id="greetingForm" onsubmit="event.preventDefault(); handleProcess();" novalidate>
        
        <!-- Photo Upload Section -->
        <div class="upload-section">
          <div 
            class="photo-uploader-circle" 
            id="photoDropzone" 
            role="button" 
            tabindex="0"
            aria-label="Upload your photo"
            onclick="triggerPhotoSelect()"
            onkeydown="if(event.key==='Enter'||event.key===' ') triggerPhotoSelect()"
          >
            <!-- Default Placeholder Content -->
            <div class="upload-placeholder-content" id="uploadPlaceholder">
              <div class="upload-icon-ring">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
              </div>
              <span class="upload-text-title">Upload Your Photo</span>
              <span class="upload-text-hint">JPG, JPEG or PNG</span>
            </div>

            <!-- Preview Image -->
            <img id="photoPreview" class="photo-preview-image" alt="Uploaded Photo Preview" />

            <!-- Hover Overlay -->
            <div class="photo-preview-overlay" id="photoPreviewOverlay">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
              <span>Change Photo</span>
            </div>
          </div>

          <!-- Hidden File Input -->
          <input 
            type="file" 
            id="photoInput" 
            accept="image/png, image/jpeg, image/jpg" 
            onchange="handlePhotoUpload(event)" 
          />

          <!-- Upload Controls -->
          <div class="upload-controls">
            <button 
              type="button" 
              class="btn-change-photo" 
              id="btnChangePhoto" 
              onclick="triggerPhotoSelect()"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                <path d="M16 21h5v-5"></path>
              </svg>
              Change Photo
            </button>
          </div>

          <!-- Optional Zoom / Adjust Control -->
          <div class="photo-adjuster" id="photoAdjuster">
            <div class="adjuster-label">
              <span>Photo Zoom</span>
              <span id="zoomValText">100%</span>
            </div>
            <input 
              type="range" 
              id="photoZoomRange" 
              class="adjuster-slider" 
              min="1" 
              max="2" 
              step="0.05" 
              value="1" 
              oninput="handleZoomChange(this.value)" 
            />
          </div>
        </div>

        <!-- Name Input Section -->
        <div class="form-group">
          <label class="form-label" for="userNameInput">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Enter Your Name
          </label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="userNameInput" 
              class="form-input" 
              placeholder="e.g. SRIJA SETHU R S" 
              maxlength="45"
              autocomplete="name"
              oninput="handleNameInput(this)"
            />
          </div>
        </div>

        <!-- Inline Validation Alert Message -->
        <div class="validation-message" id="validationAlert" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="validationText">Please enter required information.</span>
        </div>

        <!-- Process Button -->
        <button type="submit" class="btn-primary-process" id="btnProcess">
          <span>Process</span>
          <span class="btn-arrow-icon">→</span>
        </button>

      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p class="footer-quote">“Our hearts beat as one for India”</p>
    <p class="footer-credits">Independence Day Digital Poster Generator</p>
  </footer>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
